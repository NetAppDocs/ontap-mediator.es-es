indexpage:
  title: Documentación de ONTAP Mediator
  summary: ONTAP Mediator admite las funciones de ONTAP al proporcionar un almacenamiento
    persistente y protegido para los metadatos de alta disponibilidad (HA), una funcionalidad
    de consulta síncrona del estado de los nodos para facilitar la determinación del
    quórum y al actuar como proxy de ping para comprobar la capacidad de respuesta
    de las controladoras.
  keywords: mediator, ONTAP, high-availability, HA, metadata, quorum, controller,
    liveliness, smbc, metrocluster, snapmirrror active sync
  lead: ONTAP Mediator admite la sincronización activa de SnapMirror y MetroCluster
    IP, ya que proporciona un almacén persistente y aislado para metadatos de alta
    disponibilidad (HA), una función de consulta sincrónica del estado de los nodos
    para facilitar la determinación del quórum, y actúa como proxy de ping para comprobar
    la actividad de los controladores.
